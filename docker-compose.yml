# Local Postgres for development with production parity.
# Not needed for the zero-config SQLite demo — this is for when you're ready to
# develop against the same database engine you'll run in production.
#
#   docker compose up -d
#   # then set in .env:
#   #   DATABASE_URL="postgresql://auctiondesk:auctiondesk@localhost:5432/auctiondesk"
#   npm run db:pg:push && npm run seed:pg
services:
  postgres:
    image: postgres:16-alpine
    container_name: auctiondesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auctiondesk
      POSTGRES_PASSWORD: auctiondesk
      POSTGRES_DB: auctiondesk
    ports:
      - "5432:5432"
    volumes:
      - auctiondesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctiondesk -d auctiondesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auctiondesk-pgdata:
